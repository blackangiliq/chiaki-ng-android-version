name: Build Android

on:
  push:
    branches: [ android-build ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install protoc and nanopb generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler python3-protobuf

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;23.1.7779620" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure persistent debug signing key
        working-directory: android
        run: |
          # Sign every build with the committed keystore so installs update in place
          # (adb install -r) without a signature mismatch, preserving app data across rebuilds.
          {
            echo "chiakiKeystore=chiaki-signing.keystore"
            echo "chiakiKeystorePW=android"
            echo "chiakiKeyAlias=chiaki"
            echo "chiakiKeyPW=android"
          } > local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
